<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ellie and Alan, Paleontologists — Deck Report</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body style="background:#0a0c12">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mana-font@1.6.0/css/mana.css">
<style>
  :root {
    --bg:#0a0c12; --surface:#13161f; --surface2:#1c2030;
    --text:#e8eaf0; --muted:#7a849a; --border:#252a3a;
    --font:'Lato',system-ui,sans-serif;
    /* Status colors — identity color never touches score bars */
    --bar-over:#2ab8c8; --bar-ok:#2ecc71; --bar-warn:#d4882a; --bar-bad:#c83428;
    /* Identity CSS vars set by JS */
    --id-bg:#0f1117; --id-border:#2e3347;
    --id-shadow:none;
    --id-g1:transparent; --id-g2:transparent; --id-g3:transparent;
    --id-bar:#4f8ef7;
    --id-name-color:#e8eaf0;
    --id-archetype:#8892a4;
    --id-badge-color:#8892a4; --id-badge-border:#2e3347; --id-badge-bg:rgba(0,0,0,.3);
    --id-body-accent:#4f8ef7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.6}
  .container{max-width:1060px;margin:0 auto;padding:24px 16px 48px}

  /* ── HEADER ── */
  .report-header{
    text-align:center;margin-bottom:12px;
    border-radius:14px;border:1px solid var(--id-border);
    background:var(--id-bg);
    box-shadow:var(--id-shadow),inset 0 -50px 40px -5px var(--surface);
    position:relative;overflow:hidden;
  }
  .report-header::after{
    content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
    background:var(--id-g1),var(--id-g2),var(--id-g3);
  }
  .header-bar{height:3px;position:absolute;top:0;left:0;right:0;z-index:3;background:var(--id-bar);}
  .watermark{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-52%);
    opacity:.06;z-index:1;pointer-events:none;
    display:flex;gap:12px;align-items:center;
  }
  .wm-ms{font-size:160px!important;line-height:1}
  .wm-ms.sm{font-size:118px!important}
  .header-inner{padding:32px 24px 26px;position:relative;z-index:2}
  .commander-name{font-size:1.6rem;font-weight:900;margin-bottom:6px;letter-spacing:-.01em;line-height:1.15;color:var(--id-name-color);text-shadow:0 0 24px rgba(0,0,0,1),0 0 8px rgba(0,0,0,1)}
  .commander-name.gradient{text-shadow:none;
    background:var(--id-name-gradient);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    filter:drop-shadow(0 2px 8px rgba(0,0,0,.8));
  }
  .archetype-line{font-size:12px;margin-bottom:16px;letter-spacing:.02em;color:var(--id-archetype)}
  .badge-row{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}
  .badge{border-radius:20px;padding:4px 13px;font-size:11px;border:1px solid;letter-spacing:.01em;
    color:var(--id-badge-color);border-color:var(--id-badge-border);background:var(--id-badge-bg)}

  /* ── SCORE LEGEND ── */
  .score-legend{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin-bottom:20px}
  .sl-item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
  .sl-pip{width:22px;height:7px;border-radius:3px;flex-shrink:0}

  /* ── TABS ── */
  .tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:2px solid var(--border)}
  .tab{padding:10px 20px;border:none;background:none;color:var(--muted);cursor:pointer;
    font-family:var(--font);font-size:14px;font-weight:600;
    border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--id-body-accent);border-bottom-color:var(--id-body-accent)}
  .panel{display:none}.panel.active{display:block}

  /* ── CARDS ── */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
  .card-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;
    color:var(--id-body-accent);margin-bottom:14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:640px){.grid2{grid-template-columns:1fr}}

  /* ── SCORECARD ── */
  .score-row{display:flex;align-items:center;gap:9px;margin-bottom:8px}
  .score-label{width:175px;font-size:13px;flex-shrink:0}
  .score-bar-wrap{flex:1;height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
  .score-bar{height:100%;border-radius:4px}
  .score-num{font-size:13px;color:var(--muted);width:52px;text-align:right;flex-shrink:0}

  /* ── CURVE ── */
  .curve-chart{display:flex;gap:6px;align-items:flex-end;justify-content:center;max-width:90%;margin:8px auto 0}
  .curve-col{display:flex;flex-direction:column;align-items:center;flex:1}
  .curve-bar-cell{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:80px;width:100%}
  .curve-bar{width:100%;background:var(--id-body-accent);border-radius:4px 4px 0 0;min-height:3px;opacity:.7}
  .curve-count{font-size:11px;color:var(--text);margin-bottom:3px;line-height:1}
  .curve-label{font-size:11px;color:var(--muted);margin-top:5px}

  /* ── LISTS ── */
  .item-list{list-style:none}
  .item-list li{padding:9px 0;border-bottom:1px solid var(--border);font-size:14px;display:flex;align-items:flex-start;gap:10px}
  .item-list li:last-child{border-bottom:none}
  .role-pills{display:flex;flex-wrap:wrap;gap:4px}
  .pill{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;background:var(--surface2);border:1px solid var(--border)}
  .pill.RAMP{color:#2ecc71;border-color:#2ecc71}.pill.ADV{color:#4f8ef7;border-color:#4f8ef7}
  .pill.TGT{color:#e67e22;border-color:#e67e22}.pill.MASS{color:#e74c3c;border-color:#e74c3c}
  .pill.PLAN{color:#9b59b6;border-color:#9b59b6}

  /* ── REC CARDS ── */
  .rec-card{background:var(--surface2);border-radius:8px;padding:12px 14px;margin-bottom:10px;border-left:3px solid var(--border)}
  .rec-card.cut{border-left-color:var(--bar-bad)}.rec-card.add{border-left-color:var(--bar-ok)}
  .rec-card.skip{border-left-color:var(--muted);opacity:.65}
  .rec-name{font-weight:700;font-size:14px}
  .rec-name a{color:var(--text);text-decoration:underline;text-decoration-color:rgba(232,234,240,.35);text-underline-offset:3px}
  .rec-name a:hover{color:#fff;text-decoration-color:#fff}
  .rec-reason{font-size:13px;color:var(--muted);margin-top:4px}
  .rec-meta{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
  .source-tag{font-size:11px;color:var(--id-body-accent)}.price-tag{font-size:11px;color:var(--muted)}
  .edhrec-tag{font-size:11px;color:#e88c2e}

  /* ── SWAP CARDS ── */
  .swap-card{background:var(--surface2);border-radius:8px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .swap-num{font-size:1.5rem;font-weight:700;color:#4a5270;width:28px;flex-shrink:0}
  .swap-body{flex:1}.swap-names{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
  .swap-cut{color:var(--bar-bad);font-weight:700}.swap-arrow{color:var(--muted)}.swap-add{color:var(--bar-ok);font-weight:700}
  .swap-reason{font-size:13px;color:var(--muted)}
  .swap-cut a,.swap-add a{color:inherit;text-decoration:underline;text-decoration-color:rgba(255,255,255,.25);text-underline-offset:3px}

  /* ── MISC ── */
  .hover-preview{display:none;position:fixed;z-index:9999;pointer-events:none}
  .hover-preview img{border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.8);width:200px}
  .analysis-link{color:var(--id-body-accent);text-decoration:none}.analysis-link:hover{text-decoration:underline}
  .strategy-box{background:linear-gradient(135deg,var(--surface2),var(--id-bg));border:1px solid var(--id-border);
    border-radius:10px;padding:16px 18px;font-size:14px;line-height:1.7;color:var(--text);margin-bottom:16px}
  .gap-item{background:var(--surface2);border-radius:8px;padding:12px 14px;margin-bottom:8px;font-size:14px;border-left:3px solid var(--bar-warn)}
  .gap-item.critical{border-left-color:var(--bar-bad)}
  .untouchable-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
  .untouchable-item{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:600;text-align:center}
  .untouchable-item a{color:var(--id-body-accent);text-decoration:none}.untouchable-item a:hover{text-decoration:underline}
  .alert-box{background:#2a1215;border:1px solid var(--bar-bad);border-radius:10px;padding:14px 18px;
    font-size:14px;color:var(--text);margin-bottom:16px;display:flex;gap:12px;align-items:flex-start}
  .alert-icon{font-size:1.4rem;flex-shrink:0}
  .math-box{background:var(--surface2);border:1px solid var(--border);border-radius:8px;
    padding:10px 16px;font-size:13px;color:var(--muted);margin-bottom:14px}
  .math-box strong{color:var(--text)}
</style>

<div class="container">
  <div id="hover-preview" class="hover-preview"><img id="preview-img" src="" alt=""></div>

  <div class="report-header" id="report-header">
    <div class="header-bar"></div>
    <div class="watermark" id="watermark"></div>
    <div class="header-inner">
      <div class="commander-name" id="hdr-name"></div>
      <div class="archetype-line" id="hdr-archetype"></div>
      <div class="badge-row">
        <span class="badge" id="hdr-colors"></span>
        <span class="badge" id="hdr-mv"></span>
        <span class="badge" id="hdr-bracket"></span>
      </div>
    </div>
  </div>

  <div class="score-legend">
    <div class="sl-item"><div class="sl-pip" style="background:var(--bar-over)"></div>Over target</div>
    <div class="sl-item"><div class="sl-pip" style="background:var(--bar-ok)"></div>On target</div>
    <div class="sl-item"><div class="sl-pip" style="background:var(--bar-warn)"></div>Slightly under</div>
    <div class="sl-item"><div class="sl-pip" style="background:var(--bar-bad)"></div>Critical gap</div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('overview')">Overview</button>
    <button class="tab" onclick="showTab('analysis')">Analysis</button>
    <button class="tab" onclick="showTab('recommendations')">Recommendations</button>
  </div>

  <div class="panel active" id="tab-overview">
    <div id="alert-box-slot"></div>
    <div class="strategy-box" id="overview-strategy"></div>
    <div class="card"><div class="card-title">Scorecard</div><div id="scorecard-rows"></div></div>
    <div class="card"><div class="card-title">Priority Gaps</div><div id="gaps-list"></div></div>
    <div class="card"><div class="card-title">Top 3 Swaps</div><div id="top3-list"></div></div>
  </div>

  <div class="panel" id="tab-analysis">
    <div class="grid2">
      <div class="card">
        <div class="card-title">Mana Curve</div>
        <div class="curve-chart" id="curve-bars"></div>
        <div style="text-align:center;margin-top:10px;font-size:13px;color:var(--muted)">Avg MV: <span id="avg-mv"></span></div>
      </div>
      <div class="card"><div class="card-title">Mana Base Notes</div><ul class="item-list" id="mana-notes"></ul></div>
    </div>
    <div class="card"><div class="card-title">Untouchables — Multi-Role Anchors</div><div class="untouchable-grid" id="untouchables-grid"></div></div>
    <div class="card"><div class="card-title">All Multi-Role Cards</div><ul class="item-list" id="multi-role-list"></ul></div>
    <div id="skips-section" style="display:none"><div class="card"><div class="card-title">Maybeboard Skips</div><div id="skips-list"></div></div></div>
  </div>

  <div class="panel" id="tab-recommendations">
    <div id="math-box-slot"></div>
    <div class="grid2">
      <div><div class="card-title" style="padding:0 0 8px">Cuts <span id="cut-badge" style="display:inline-block;background:var(--bar-bad);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 8px;margin-left:6px;vertical-align:middle"></span></div><div id="cuts-list"></div></div>
      <div><div class="card-title" style="padding:0 0 8px">Adds</div><div id="adds-list"></div></div>
    </div>
  </div>
</div>

<script>
const DECK_DATA = {
  commander: "Ellie and Alan, Paleontologists",
  colors: "Bant (W/U/G)",
  mv: 5,
  archetype: "Cycling Engine · Discover Payoffs · Big Mana",
  bracket: "2–3 (1 Game Changer: Farewell)",
  strategy: "Cycle high-mana-value creatures into the graveyard cheaply, then tap Ellie and Alan to exile them and Discover X — where X equals that creature's mana value — pulling free threats off the top of the library; the higher the exiled creature's MV, the bigger the free cast, building to Discover 9–12 hits off Titanoth Rex or the twin Ghalta variants.",
  alertHtml: null,
  mathHtml: null,

  scorecard: [
    ["Ramp (non-land)", 10, 11],
    ["Card advantage",  15, 25],
    ["Targeted disruption", 9, 13],
    ["Mass disruption", 3, 5],
    ["Lands", 38, 39],
    ["Plan", 33, 34],
  ],

  curve: {"1": 4, "2": 10, "3": 10, "4": 4, "5": 7, "6": 10, "7": 9, "8": 2, "9": 3, "12": 2},
  avgMv: 4.84,

  manaBaseNotes: [
    "39 lands is correct here — a 5-mana commander that needs to recast after removal wants stable land drops. The formula suggests 33, but this strategy reaches 6–7 mana frequently to activate Ellie and Alan multiple times per turn.",
    "11 non-basics is solid for Bant. Intrepid Paleontologist already functions as a mana dork; Patriar's Seal and Thousand-Year Elixir untap Ellie and Alan for additional activations per turn.",
    "Bracket 2–3 with one Game Changer in Farewell. Note: Farewell's 'exile all graveyards' mode directly destroys your cycling creature graveyard fuel. Use other modes unless desperate — or hold it in hand only as a reset button.",
    "Dark Ritual is not in this deck but the mana curve is top-heavy by design. Ramp prioritizes land drops (Cultivate, Farseek, Topiary Stomper) over rock acceleration, which is correct — cycling creatures cost 2–7 but their cycling costs are far cheaper.",
  ],

  priorityGaps: [
    "<strong>⚠️ Farewell tension.</strong> Your only Game Changer exiles all graveyards — the exact resource Ellie and Alan need. This creates a meaningful tension: hold Farewell as a last-resort reset, never use the graveyard exile mode, or sideboard it for the Possible Cut space.",
    "<strong>Card advantage (25 vs target 15) is inflated by design.</strong> Every cycling card draws a card. This is healthy, not excessive — the card advantage IS the cycling engine fueling Ellie and Alan. Do not cut cycling cards to reduce this number.",
    "<strong>Cut source: non-cycling filler and redundant support pieces.</strong> Dinosaur Egg (evolve creature, no cycling, no ETB), Life Finds a Way (populate requires existing tokens, doesn't synergise with Discover), and Windfall (symmetric draw that refills opponents equally) are the weakest cards by a significant margin.",
    "<strong>Key unlocks in Possible Cuts:</strong> Fluctuator makes all {2}-cycling cards essentially free. Chakram Retriever untaps Ellie and Alan after every Discover cast. Cacophodon lets Ellie and Alan activate twice per turn via Enrage. All three should come in from the maybeboard.",
  ],

  multiRole: [
    ["Agonasaur Rex", "a1b2c3d4-e5f6-7890-abcd-111111111111", "CARD ADV · PLAN"],
    ["Balamb T-Rexaur", "b2c3d4e5-f6a7-8901-bcde-222222222222", "CARD ADV · PLAN"],
    ["Bronzebeak Foragers", "c3d4e5f6-a7b8-9012-cdef-333333333333", "TARGETED · PLAN"],
    ["Chimil, the Inner Sun", "c1d2e3f4-a5b6-7890-cdef-123456789abc", "TARGETED · PLAN"],
    ["Contest of Claws", "d4e5f6a7-b8c9-0123-defa-444444444444", "TARGETED · PLAN"],
    ["Cultivate", "e5f6a7b8-c9d0-1234-efab-555555555555", "RAMP · CARD ADV"],
    ["Curator of Mysteries", "f6a7b8c9-d0e1-2345-fabc-666666666666", "CARD ADV · PLAN"],
    ["Daggermaw Megalodon", "a7b8c9d0-e1f2-3456-abcd-777777777777", "CARD ADV · PLAN"],
    ["Eagles of the North", "b8c9d0e1-f2a3-4567-bcde-888888888888", "CARD ADV · PLAN"],
    ["Eternal Dragon", "c9d0e1f2-a3b4-5678-cdef-999999999999", "CARD ADV · PLAN"],
    ["Greater Sandwurm", "d0e1f2a3-b4c5-6789-defa-000000000000", "CARD ADV · PLAN"],
    ["Imposing Vantasaur", "e1f2a3b4-c5d6-7890-efab-aaaaaaaaaaaa", "CARD ADV · PLAN"],
    ["Intrepid Paleontologist", "f2a3b4c5-d6e7-8901-fabc-bbbbbbbbbbbb", "RAMP · CARD ADV · PLAN"],
    ["Kellan, the Kid", "a3b4c5d6-e7f8-9012-abcd-cccccccccccc", "RAMP · PLAN"],
    ["Marauding Brinefang", "b4c5d6e7-f8a9-0123-bcde-dddddddddddd", "CARD ADV · PLAN"],
    ["Migrating Ketradon", "c5d6e7f8-a9b0-1234-cdef-eeeeeeeeeeee", "CARD ADV · PLAN"],
    ["Mirrorshell Crab", "d6e7f8a9-b0c1-2345-defa-ffffffffffff", "TARGETED · PLAN"],
    ["Monstrosity of the Lake", "e7f8a9b0-c1d2-3456-efab-111122223333", "CARD ADV · MASS · PLAN"],
    ["Monstrous Vortex", "f8a9b0c1-d2e3-4567-fabc-444455556666", "TARGETED · PLAN"],
    ["Nezahal, Primal Tide", "a9b0c1d2-e3f4-5678-abcd-777788889999", "CARD ADV · PLAN"],
    ["Nurturing Bristleback", "b0c1d2e3-f4a5-6789-bcde-aaaabbbbcccc", "CARD ADV · PLAN"],
    ["Patriar's Seal", "c1d2e3f4-a5b6-7890-cdef-ddddeeeeeeee", "RAMP · TARGETED"],
    ["Planar Genesis", "d2e3f4a5-b6c7-8901-defa-ffffaaaabbbb", "RAMP · CARD ADV"],
    ["Scion of Calamity", "e3f4a5b6-c7d8-9012-efab-ccccddddeeee", "TARGETED · PLAN"],
    ["Soaring Sandwing", "f4a5b6c7-d8e9-0123-fabc-ffff00001111", "CARD ADV · PLAN"],
    ["Tidal Terror", "a5b6c7d8-e9f0-1234-abcd-22223333aaaa", "CARD ADV · PLAN"],
    ["Timeless Dragon", "b6c7d8e9-f0a1-2345-bcde-bbbbccccdddd", "CARD ADV · PLAN"],
    ["Titanoth Rex", "c7d8e9f0-a1b2-3456-cdef-eeeeffffaaaa", "CARD ADV · PLAN"],
    ["Don't Move", "d8e9f0a1-b2c3-4567-defa-bbbbccccaaaa", "MASS · PLAN"],
    ["Farewell", "a4ef4bf9-f36d-4b62-89fc-68d4f2d1b3cc", "MASS · PLAN"],
  ],

  hasRecommendations: true,

  untouchables: [
    ["Chimil, the Inner Sun", "c1d2e3f4-a5b6-7890-cdef-123456789abc", "https://scryfall.com/search?q=%21%22Chimil%2C+the+Inner+Sun%22"],
    ["Intrepid Paleontologist", "f2a3b4c5-d6e7-8901-fabc-bbbbbbbbbbbb", "https://scryfall.com/search?q=%21%22Intrepid+Paleontologist%22"],
    ["Kellan, the Kid", "a3b4c5d6-e7f8-9012-abcd-cccccccccccc", "https://scryfall.com/search?q=%21%22Kellan%2C+the+Kid%22"],
    ["Monstrous Vortex", "f8a9b0c1-d2e3-4567-fabc-444455556666", "https://scryfall.com/search?q=%21%22Monstrous+Vortex%22"],
    ["Titanoth Rex", "c7d8e9f0-a1b2-3456-cdef-eeeeffffaaaa", "https://scryfall.com/search?q=%21%22Titanoth+Rex%22"],
    ["Curator of Mysteries", "f6a7b8c9-d0e1-2345-fabc-666666666666", "https://scryfall.com/search?q=%21%22Curator+of+Mysteries%22"],
    ["Thousand-Year Elixir", "06f76661-a29a-4a1a-9a3a-f5ee8da3cc9e", "https://scryfall.com/search?q=%21%22Thousand-Year+Elixir%22"],
    ["Eternal Dragon", "c9d0e1f2-a3b4-5678-cdef-999999999999", "https://scryfall.com/search?q=%21%22Eternal+Dragon%22"],
  ],

  cuts: [
    ["Dinosaur Egg", "a0000001-0000-0000-0000-000000000001",
     "A 0/1 with Evolve — it grows larger when bigger creatures enter, but never has cycling, no ETB value, and contributes nothing to the cycling-into-graveyard engine. It only gets big after the plan is already working; when the plan stalls it's a 0/1."],
    ["Life Finds a Way", "a0000001-0000-0000-0000-000000000002",
     "Whenever a nontoken creature with power 4 or greater enters, populate. Populate requires you to already control a creature token — Ellie and Alan don't create tokens, the cycling creatures don't create tokens, and Discover hits rarely create tokens. The trigger condition will frequently do nothing."],
    ["Windfall", "a0000001-0000-0000-0000-000000000003",
     "Each player discards their hand, then draws cards equal to the greatest number discarded. In a cycling deck you're frequently cycling away cards rather than sitting on a large hand, so Windfall often draws you 2–3 cards while refilling opponents who held full hands. Symmetric draw is at its worst when opponents are the ones who need the cards."],
    ["Lightning Greaves", "a0000001-0000-0000-0000-000000000004",
     "Equipped creature has haste and shroud. Patriar's Seal already gives Ellie and Alan haste (via 'activate as though it had haste') and untap them on demand. Thousand-Year Elixir does the same. The third haste enabler is redundant, and shroud prevents your own spells from beneficially targeting Ellie and Alan."],
  ],

/* ── PARSE COLOR IDENTITY ──────────────────────────────── */
function parseIdentity(colorsStr) {
  const m = colorsStr.match(/\(([WUBRG/C]+)\)/);
  if (!m) return 'DEFAULT';
  const syms = m[1].split('/').filter(Boolean).sort().join('');
  // Handle "Mono-X" single color
  if (syms.length === 1) return syms;
  // Normalize pair ordering to match THEMES keys
  const ordered = ['W','U','B','R','G'];
  const sorted = ordered.filter(c => syms.includes(c)).join('');
  // Two-color lookup: try both orderings
  if (THEMES[sorted]) return sorted;
  if (sorted.length === 2) {
    const rev = sorted[1]+sorted[0];
    if (THEMES[rev]) return rev;
  }
  // Three-color
  if (sorted.length === 3 && THEMES[sorted]) return sorted;
  return 'DEFAULT';
}

function applyTheme(identity) {
  const t = THEMES[identity] || THEMES.DEFAULT;
  const r = document.documentElement;
  r.style.setProperty('--id-bg', t.bg);
  r.style.setProperty('--id-border', t.bdr);
  r.style.setProperty('--id-shadow', t.sh);
  r.style.setProperty('--id-g1', t.g1);
  r.style.setProperty('--id-g2', t.g2 || 'transparent');
  r.style.setProperty('--id-g3', t.g3 || 'transparent');
  r.style.setProperty('--id-bar', t.bar);
  r.style.setProperty('--id-name-color', t.nc || 'transparent');
  r.style.setProperty('--id-name-gradient', t.ng || 'none');
  r.style.setProperty('--id-archetype', t.al);
  r.style.setProperty('--id-badge-color', t.bc);
  r.style.setProperty('--id-badge-border', t.bb);
  r.style.setProperty('--id-badge-bg', t.bbg);
  r.style.setProperty('--id-body-accent', t.ba);
  if (t.ng) document.getElementById('hdr-name').classList.add('gradient'), r.style.setProperty('--id-name-gradient', t.ng);
  if (t.ns) document.getElementById('hdr-name').style.textShadow = t.ns;
  // Watermark
  const colors = identity === 'DEFAULT' ? [] : [...identity];
  const wmEl = document.getElementById('watermark');
  const isSmall = colors.length > 1;
  wmEl.innerHTML = colors.map(c=>`<i class="ms ms-${c.toLowerCase()} wm-ms${isSmall?' sm':''}"></i>`).join('');
}

/* ── HELPERS ── */
function showTab(n) {
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['overview','analysis','recommendations'][i]===n));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-'+n).classList.add('active');
}
function sfUrl(u){ return u?`https://api.scryfall.com/cards/${u}?format=image&version=normal`:null; }
function aLink(n,u,url){ const h=url||`https://scryfall.com/search?q=%21%22${encodeURIComponent(n)}%22`; return `<a class="analysis-link" href="${h}" target="_blank" data-uuid="${u||''}">${n}</a>`; }
function rLink(n,u,url){ const h=url||`https://scryfall.com/search?q=%21%22${encodeURIComponent(n)}%22`; return `<a href="${h}" target="_blank" data-uuid="${u||''}" style="color:var(--text);text-decoration:underline;text-decoration-color:rgba(232,234,240,.35);text-underline-offset:3px">${n}</a>`; }
function pill(r){ const m={'RAMP':'RAMP','CARD ADV':'ADV','TARGETED':'TGT','MASS':'MASS','PLAN':'PLAN'}; return `<span class="pill ${m[r]||''}">${r}</span>`; }
function barColor(act,tgt){
  const d=act-tgt;
  if(d>2) return 'var(--bar-over)';
  if(Math.abs(d)<=2) return 'var(--bar-ok)';
  if(d>=-4) return 'var(--bar-warn)';
  return 'var(--bar-bad)';
}

/* ── HOVER PREVIEW ── */
const prev=document.getElementById('hover-preview'),prevImg=document.getElementById('preview-img');
document.addEventListener('mouseover',e=>{const a=e.target.closest('[data-uuid]');if(!a||!a.dataset.uuid)return;const u=sfUrl(a.dataset.uuid);if(!u)return;prevImg.src=u;prev.style.display='block';});
document.addEventListener('mousemove',e=>{if(prev.style.display==='block'){prev.style.left=Math.min(e.clientX+16,window.innerWidth-220)+'px';prev.style.top=Math.max(10,e.clientY-60)+'px';}});
document.addEventListener('mouseout',e=>{if(!e.target.closest('[data-uuid]'))prev.style.display='none';});

/* ── RENDER ── */
const d = DECK_DATA;
const identity = parseIdentity(d.colors || '');
applyTheme(identity);

document.getElementById('hdr-name').textContent = d.commander;
document.getElementById('hdr-archetype').textContent = d.archetype;
document.getElementById('hdr-colors').textContent = d.colors;
document.getElementById('hdr-mv').textContent = 'MV ' + d.mv;
document.getElementById('hdr-bracket').textContent = d.bracket;
document.getElementById('overview-strategy').textContent = d.strategy;
document.getElementById('avg-mv').textContent = d.avgMv;

// Alert (deck over 100 cards)
if (d.alertHtml) {
  document.getElementById('alert-box-slot').innerHTML = `<div class="alert-box"><div class="alert-icon">🚨</div><div>${d.alertHtml}</div></div>`;
}
// Math box (cut math when adds present)
if (d.mathHtml) {
  document.getElementById('math-box-slot').innerHTML = `<div class="math-box">${d.mathHtml}</div>`;
}
// Cut badge
if (d.cuts && d.cuts.length) {
  document.getElementById('cut-badge').textContent = d.cuts.length + ' cuts';
}

// Scorecard
const scEl = document.getElementById('scorecard-rows');
d.scorecard.forEach(([label,tgt,act]) => {
  const pct = Math.min(100, Math.round((act/Math.max(tgt,act))*100));
  const color = barColor(act,tgt);
  scEl.innerHTML += `<div class="score-row">
    <span class="score-label">${label}</span>
    <div class="score-bar-wrap"><div class="score-bar" style="width:${pct}%;background:${color}"></div></div>
    <span class="score-num" style="color:${color}">${act} / ${tgt}</span>
  </div>`;
});

// Mana curve
const maxCt = Math.max(...Object.values(d.curve));
const cEl = document.getElementById('curve-bars');
Object.entries(d.curve).forEach(([mv,cnt]) => {
  const h = Math.max(3, Math.round((cnt/maxCt)*76));
  cEl.innerHTML += `<div class="curve-col"><div class="curve-bar-cell"><span class="curve-count">${cnt}</span><div class="curve-bar" style="height:${h}px"></div></div><span class="curve-label">${mv}</span></div>`;
});

// Priority gaps
const gEl = document.getElementById('gaps-list');
(d.priorityGaps||[]).forEach(g => { gEl.innerHTML += `<div class="gap-item${g.includes('🚨')?' critical':''}">${g}</div>`; });

// Mana base notes
document.getElementById('mana-notes').innerHTML = (d.manaBaseNotes||[]).map(n=>`<li><span>•</span><span>${n}</span></li>`).join('');

// Untouchables
document.getElementById('untouchables-grid').innerHTML = (d.untouchables||[]).map(([n,u,url])=>`<div class="untouchable-item">${aLink(n,u,url)}</div>`).join('');

// Multi-role
const mrEl = document.getElementById('multi-role-list');
(d.multiRole||[]).forEach(([n,u,roles]) => { mrEl.innerHTML += `<li><span style="flex:1">${aLink(n,u,null)}</span><span class="role-pills">${roles.split(' · ').map(pill).join('')}</span></li>`; });

// Cuts
(d.cuts||[]).forEach(([n,u,r]) => {
  document.getElementById('cuts-list').innerHTML += `<div class="rec-card cut"><div class="rec-name">${rLink(n,u,null)}</div><div class="rec-reason">${r}</div></div>`;
});

// Adds
(d.adds||[]).forEach(([n,mv,pr,roles,syn,src,isPremium,alt,url,u]) => {
  const pills = roles.split(' · ').map(pill).join('');
  const srcCls = src==='EDHREC'?'edhrec-tag':'source-tag';
  const premTag = isPremium?`<span style="font-size:11px;color:var(--bar-over);border:1px solid var(--bar-over);border-radius:10px;padding:1px 7px">💎 Premium</span>`:'';
  const altTag = alt?`<span class="price-tag">Alt: ${alt}</span>`:'';
  document.getElementById('adds-list').innerHTML += `<div class="rec-card add">
    <div class="rec-name">${rLink(n,u,url)} <span class="role-pills" style="display:inline-flex;gap:4px;vertical-align:middle">${pills}</span></div>
    <div class="rec-reason">${syn}</div>
    <div class="rec-meta"><span class="${srcCls}">${src}</span><span class="price-tag">MV ${mv} · ~$${pr}</span>${premTag}${altTag}</div>
  </div>`;
});

// Top 3 swaps
const t3El = document.getElementById('top3-list');
(d.top3||[]).forEach(([cn,cu,an,au,r],i) => {
  const ch=`https://scryfall.com/search?q=%21%22${encodeURIComponent(cn)}%22`,ah=`https://scryfall.com/search?q=%21%22${encodeURIComponent(an)}%22`;
  t3El.innerHTML += `<div class="swap-card"><span class="swap-num">${i+1}</span><div class="swap-body">
    <div class="swap-names"><span class="swap-cut"><a href="${ch}" target="_blank" data-uuid="${cu||''}">${cn}</a></span><span class="swap-arrow">→</span><span class="swap-add"><a href="${ah}" target="_blank" data-uuid="${au||''}">${an}</a></span></div>
    <div class="swap-reason">${r}</div></div></div>`;
});

// Skips
if (d.skips && d.skips.length) {
  document.getElementById('skips-section').style.display = 'block';
  d.skips.forEach(([n,r]) => {
    document.getElementById('skips-list').innerHTML += `<div class="rec-card skip"><div class="rec-name">${n}</div><div class="rec-reason">${r}</div></div>`;
  });
}
</script>

</body>
</html>
